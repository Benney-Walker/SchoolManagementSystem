spring.application.name=SchoolManagementSystem

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${USERNAME}
spring.mail.password=${PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

subscription.code = ${SUBSCRIPTION_CODE}
jwt.secret = ${JWT_SECRET}
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.root=INFO
logging.level.com.codewithben.schoolmanagementsystem=INFO

# Console pattern: timestamp, level, thread, logger, message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Rolling file output so logs survive restarts
logging.file.name=logs/school-management.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.logback.rollingpolicy.file-name-pattern=logs/school-management-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# ---------------------------------------------------------------
# Sms
# ---------------------------------------------------------------
hubtel.send-url =
hubtel.client-id =
hubtel.client-secret =
hubtel.sender-id =

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest