spring.application.name=SchoolManagementSystem

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-test-query=SELECT 1

subscription.code = ${SUBSCRIPTION_CODE}
jwt.secret = ${JWT_SECRET}
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Allowed browser origins for the web dashboard (comma-separated, no trailing slash)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://project-1q3u6.vercel.app}

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.root=INFO
logging.level.com.codewithben.schoolmanagementsystem=INFO

# Console pattern: timestamp, level, thread, logger, message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Rolling file output so logs survive restarts
logging.file.name=logs/school-management.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.logback.rollingpolicy.file-name-pattern=logs/school-management-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Set how long the client should wait before attempting to reconnect (in milliseconds)
spring.rabbitmq.connection-timeout=10000
# Ensure heartbeats are configured so dropped TCP sockets are detected quickly
spring.rabbitmq.requested-heartbeat=60

# Publisher confirms + returns: broker rejections and unroutable messages are
# logged by the callbacks in RabbitMQConfig instead of being lost silently.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumer retry: 3 attempts with backoff (2s, 4s), then the message is moved to
# the dead-letter queue (see RabbitMQConfig.messageRecoverer) instead of being
# requeued forever. SMS consumers use a separate factory with no retry.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------
# Agoo sms config
# ---------------------------------------------------------------
agoo.bulk.sms.url=${AGOO_BULK_SMS_URL}
agoo.sms.url=${AGOO_SMS_URL}
agoo.sms.api.key=${AGOO_API_KEY}
agoo.sms.sender.id=${AGOO_SENDER_ID}

# ---------------------------------------------------------------
# Vynfy sms config
# ---------------------------------------------------------------
vynfy.sms.url=${VYNFY_SMS_URL}
vynfy.sms.api.key=${VYNFY_API_KEY}
vynfy.sms.sender.id=${VYNFY_SENDER_ID}

attendance.default.message=DAILY ATTENDANCE REPORT
payment.report.header=PAYMENT REPORT